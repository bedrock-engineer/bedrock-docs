<svg xmlns="http://www.w3.org/2000/svg" class="h-auto w-full" viewBox="0 0 800 340" role="img" aria-label="Five ways to control groundwater in one ground cross-section of sand over clay, with what to check on each. Dewatering with pumped wells: inflow, and settlement of a nearby house. Cutoff walls keyed into the clay: leakage. Recharge wells: the effect on the wooden piles of a nearby house, whose heads must stay below the groundwater. Relief wells under an excavation: hydraulic heave. Impermeable floor with tension piles: uplift.">
  <defs>
    <pattern id="gw-sand" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="0.9" class="fill-gray-8"/><circle cx="9" cy="9" r="0.9" class="fill-gray-8"/></pattern>
    <pattern id="gw-clay" width="20" height="8" patternUnits="userSpaceOnUse"><path d="M0 2H8M10 6H18" class="stroke-gray-8" stroke-width="0.75"/></pattern>
    <marker id="gw-load" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fill-doc-text"/></marker>
    <marker id="gw-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fill-doc-accent"/></marker>
  </defs>

  <!-- Ground and groundwater -->
  <path d="M0 150H66L76 195H124L134 150H299V200H381V150H556L571 190H649L664 150H693V214H777V150H800V238H0z" fill="url(#gw-sand)"/>
  <rect x="0" y="238" width="800" height="50" fill="url(#gw-clay)"/>
  <g class="fill-none stroke-doc-line">
    <path d="M0 238H800" class="stroke-gray-7" stroke-width="0.75"/>
    <path d="M0 168Q30 172 50 205Q100 200 150 205Q170 176 220 168H296M302 206H378M384 168H410Q430 160 450 166H562Q575 196 610 196Q645 196 658 168H690M780 168H800" stroke-width="1" stroke-dasharray="6 4"/>
    <path d="M234 161H246L240 168zM236 172H244M238 175H242" stroke-width="1.25"/>
    <path d="M0 150H66L76 195H124L134 150H296M302 200H378M384 150H556L571 190H649L664 150H690M780 150H800" stroke-width="1.5"/>
  </g>

  <!-- Structures -->
  <g class="stroke-doc-text" stroke-width="1.25">
    <g class="fill-gray-5"><rect x="48" y="140" width="4" height="92"/><rect x="148" y="140" width="4" height="92"/></g>
    <path d="M170 106L192 90L214 106z" class="fill-doc-surface"/>
    <rect x="172" y="106" width="40" height="44" class="fill-doc-surface"/>
    <g class="fill-gray-5"><rect x="172" y="150" width="8" height="6"/><rect x="204" y="150" width="8" height="6"/></g>
    <g class="fill-gray-5"><rect x="296" y="104" width="6" height="160"/><rect x="378" y="104" width="6" height="160"/></g>
    <rect x="428" y="140" width="4" height="92" class="fill-gray-5"/>
    <path d="M460 106L484 90L508 106z" class="fill-doc-surface"/>
    <rect x="462" y="106" width="44" height="44" class="fill-doc-surface"/>
    <rect x="462" y="150" width="44" height="22" class="fill-gray-4"/>
    <path d="M468 172V210M484 172V210M500 172V210" class="fill-none"/>
    <g class="fill-gray-5"><rect x="588" y="190" width="4" height="44"/><rect x="628" y="190" width="4" height="44"/></g>
    <g class="fill-gray-5"><rect x="690" y="104" width="6" height="158"/><rect x="774" y="104" width="6" height="158"/><rect x="696" y="200" width="78" height="14"/></g>
    <path d="M712 214V266M735 214V266M758 214V266" class="fill-none" stroke-width="1.5"/>
  </g>

  <!-- Loads -->
  <g class="fill-none stroke-doc-text" stroke-width="1.25" marker-end="url(#gw-load)">
    <path d="M430 116V136"/>
    <path d="M590 186V172"/>
    <path d="M630 186V172"/>
  </g>

  <!-- Checks -->
  <g class="fill-none stroke-doc-accent" stroke-width="1.5">
    <g marker-end="url(#gw-check)"><path d="M50 136V120"/><path d="M150 136V120"/><path d="M282 186H316"/><path d="M610 232V208"/><path d="M720 236V218"/><path d="M748 236V218"/></g>
    <path d="M168 160Q192 170 216 160" stroke-dasharray="5 3"/>
    <rect x="460" y="167" width="48" height="10" rx="3" stroke-dasharray="4 2"/>
  </g>
  <g class="fill-doc-accent-text" font-size="11.5" text-anchor="middle">
    <text x="100" y="128">inflow</text>
    <text x="192" y="226">settlement</text>
    <text x="262" y="204">leakage</text>
    <text x="494" y="228">effect on wooden piles</text>
    <text x="610" y="256">hydraulic heave</text>
    <text x="735" y="192">uplift</text>
  </g>

  <!-- Typologies -->
  <g text-anchor="middle">
    <g class="fill-doc-text" font-size="13" font-weight="600">
      <text x="110" y="312">Dewatering</text>
      <text x="340" y="312">Cutoff walls</text>
      <text x="470" y="312">Recharge</text>
      <text x="610" y="312">Relief wells</text>
      <text x="735" y="312">Impermeable floor</text>
    </g>
    <g class="fill-doc-muted" font-size="11.5">
      <text x="110" y="328">pumped wells</text>
      <text x="340" y="328">keyed into clay</text>
      <text x="470" y="328">injection wells</text>
      <text x="610" y="328">under an excavation</text>
      <text x="735" y="328">with tension piles</text>
    </g>
  </g>
</svg>
