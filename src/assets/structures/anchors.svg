<svg xmlns="http://www.w3.org/2000/svg" class="h-auto w-full" viewBox="0 0 800 340" role="img" aria-label="Four anchors in one ground cross-section of sand over clay and rock, with what to check on each. Grouted anchor tying back a wall: pull-out at the grout and a deep slip of the anchored block. Rock anchors holding down a tower: interaction within the group. Screw anchor for a guyed mast: creep. Deadman anchor behind a sheet pile wall: its passive wedge must stay clear of the wall's active wedge.">
