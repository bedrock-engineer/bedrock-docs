<svg xmlns="http://www.w3.org/2000/svg" class="h-auto w-full" viewBox="0 0 800 340" role="img" aria-label="Four kinds of rock support in one rock cross-section, with what to check on each. Bolted rock slope: bolts across a joint, against block sliding. Shotcrete and mesh on a rock face: a loose wedge loading the shotcrete. Tunnel support with radial bolts and a shotcrete lining: ground-support interaction as the tunnel converges. Rockfall drape over a face: how far falling blocks still reach.">
  <defs>
    <pattern id="rb-rock" width="24" height="16" patternUnits="userSpaceOnUse"><path d="M0 0.5H24M0 8.5H24M6 0.5V8.5M18 8.5V16" class="fill-none stroke-gray-8" stroke-width="0.75"/></pattern>
    <marker id="rb-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fill-doc-accent"/></marker>
  </defs>

  <!-- Rock -->
  <path d="M0 50H60L110 200H200L240 70H575L660 250H800V288H0z" fill="url(#rb-rock)"/>
  <path d="M0 50H60L110 200H200L240 70H575L660 250H800" class="fill-none stroke-doc-line" stroke-width="1.5"/>

  <!-- Support -->
  <circle cx="430" cy="180" r="41" class="fill-doc-surface"/>
  <g class="fill-none stroke-doc-text" stroke-width="1.25">
    <path d="M76.7 100L6.7 123M86.7 130L16.7 153M96.7 160L26.7 183"/>
    <path d="M230.8 100L290.8 115M218.5 140L278.5 155M207.7 175L267.7 190"/>
    <path d="M389 180H358M394.5 159.5L367.6 144M409.5 144.5L394 117.6M430 139V108M450.5 144.5L466 117.6M465.5 159.5L492.4 144M471 180H502"/>
    <circle cx="430" cy="180" r="40.5"/>
    <path d="M566 70L545 94M552 70L531 94"/>
    <path d="M548 67H578L665 247" stroke-dasharray="3 2"/>
  </g>
  <circle cx="430" cy="180" r="38" class="fill-none stroke-gray-5" stroke-width="4"/>
  <g class="fill-doc-text"><circle cx="76.7" cy="100" r="2.5"/><circle cx="86.7" cy="130" r="2.5"/><circle cx="96.7" cy="160" r="2.5"/></g>
  <path d="M195 200L235 70H240L200 200z" class="fill-gray-5 stroke-doc-text" stroke-width="1.25"/>
  <rect x="708" y="240" width="7" height="7" class="fill-gray-5 stroke-doc-text" stroke-width="1"/>

  <!-- Checks -->
  <g class="fill-none stroke-doc-accent" stroke-width="1.5">
    <path d="M25 50L93.3 150" stroke-dasharray="5 3"/>
    <path d="M228.5 108L254 136L214.4 155" stroke-dasharray="5 3"/>
    <path d="M232 132H206" marker-end="url(#rb-check)"/>
    <circle cx="430" cy="180" r="32" stroke-dasharray="5 3"/>
    <path d="M664 246Q688 228 706 242" stroke-dasharray="1 3" stroke-linecap="round" marker-end="url(#rb-check)"/>
  </g>
  <g class="fill-doc-accent-text" font-size="11.5" text-anchor="middle">
    <text x="14" y="206" text-anchor="start">block sliding</text>
    <text x="196" y="118" text-anchor="end">shotcrete capacity</text>
    <text x="430" y="250">ground-support interaction</text>
    <text x="740" y="230">rockfall reach</text>
  </g>

  <!-- Typologies -->
  <g text-anchor="middle">
    <g class="fill-doc-text" font-size="13" font-weight="600">
      <text x="62" y="312">Bolted rock slope</text>
      <text x="222" y="312">Shotcrete and mesh</text>
      <text x="430" y="312">Tunnel support</text>
      <text x="660" y="312">Rockfall drape</text>
    </g>
    <g class="fill-doc-muted" font-size="11.5">
      <text x="62" y="328">bolts across a joint</text>
      <text x="222" y="328">on a rock face</text>
      <text x="430" y="328">bolts and shotcrete</text>
      <text x="660" y="328">mesh over the face</text>
    </g>
  </g>
</svg>
