<svg xmlns="http://www.w3.org/2000/svg" class="h-auto w-full" viewBox="0 0 800 340" role="img" aria-label="Three dams in one cross-section, each holding back water or tailings on its left, with what to check on each. Embankment dam with a clay core: upstream slope stability under rapid drawdown, and internal erosion under the dam. Concrete gravity dam on rock: uplift under its base and sliding. Tailings dam raised in steps: liquefaction of the tailings and overall stability of the downstream slope.">
  <defs>
    <pattern id="dm-sand" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="0.9" class="fill-gray-8"/><circle cx="9" cy="9" r="0.9" class="fill-gray-8"/></pattern>
    <pattern id="dm-clay" width="20" height="8" patternUnits="userSpaceOnUse"><path d="M0 2H8M10 6H18" class="stroke-gray-8" stroke-width="0.75"/></pattern>
    <pattern id="dm-fill" width="14" height="14" patternUnits="userSpaceOnUse"><g class="fill-none stroke-gray-8" stroke-width="0.75"><circle cx="4" cy="4" r="1.6"/><circle cx="11" cy="11" r="1.6"/></g></pattern>
    <pattern id="dm-rock" width="24" height="16" patternUnits="userSpaceOnUse"><path d="M0 0.5H24M0 8.5H24M6 0.5V8.5M18 8.5V16" class="fill-none stroke-gray-8" stroke-width="0.75"/></pattern>
    <marker id="dm-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fill-doc-accent"/></marker>
  </defs>

  <!-- Ground, water and tailings -->
  <path d="M0 86H104L40 150H0z" class="fill-gray-3"/>
  <path d="M269.6 70H370V150H286z" class="fill-gray-3"/>
  <rect x="0" y="150" width="800" height="88" fill="url(#dm-sand)"/>
  <rect x="0" y="238" width="800" height="50" fill="url(#dm-clay)"/>
  <path d="M520 150L540 62L560 150z" fill="url(#dm-sand)"/>
  <path d="M250 150L268 62L286 150H520V288H245z" class="fill-doc-surface"/>
  <path d="M250 150L268 62L286 150H520V288H245z" fill="url(#dm-rock)"/>
  <path d="M543.2 76H662L640 150H560z" fill="url(#dm-clay)"/>
  <path d="M541.4 70H604L596 76H543.2z" class="fill-gray-3"/>
  <path d="M40 150L120 70H150L240 150z" fill="url(#dm-fill)"/>
  <path d="M122 70H148L162 150H108z" class="fill-doc-surface"/>
  <path d="M122 70H148L162 150H108z" fill="url(#dm-clay)"/>
  <path d="M660 74H672L690 92H698L716 110H724L742 128H750L772 150H640z" fill="url(#dm-fill)"/>
  <g class="fill-none stroke-doc-line">
    <path d="M0 238H245M520 238H800M250 150L245 288M520 150V288" class="stroke-gray-7" stroke-width="0.75"/>
    <path d="M122 70L108 150M148 70L162 150" class="stroke-gray-7" stroke-width="0.75"/>
    <path d="M104 86H124Q140 124 238 148" stroke-width="1" stroke-dasharray="6 4"/>
    <path d="M0 86H104M269.6 70H370M541.4 70H604M10 79H22L16 86zM12 90H20M14 93H18M294 63H306L300 70zM296 74H304M298 77H302" stroke-width="1.25"/>
    <path d="M0 150H40L120 70H150L240 150H250L268 62L286 150H370M452 150H520L540 62L560 150H640M543.2 76H660H672L690 92H698L716 110H724L742 128H750L772 150H800" stroke-width="1.5"/>
  </g>

  <!-- Structures -->
  <path d="M370 56H392L452 150H370z" class="fill-gray-5 stroke-doc-text" stroke-width="1.25"/>

  <!-- Checks -->
  <g class="fill-none stroke-doc-accent" stroke-width="1.5">
    <path d="M125 70A64.3 64.3 0 0 1 30 152" stroke-dasharray="5 3"/>
    <path d="M60 172Q140 196 236 160" stroke-dasharray="5 3" marker-end="url(#dm-check)"/>
    <g marker-end="url(#dm-check)"><path d="M385 176V156"/><path d="M410 176V156"/><path d="M435 176V156"/><path d="M455 144H488"/></g>
    <path d="M578 124q5 -4 10 0t10 0t10 0t10 0"/>
    <path d="M670 74A69.3 69.3 0 0 0 785 150" stroke-dasharray="5 3"/>
  </g>
  <g class="fill-doc-accent-text" font-size="11.5" text-anchor="middle">
    <text x="50" y="64">rapid drawdown</text>
    <text x="140" y="214">internal erosion</text>
    <text x="468" y="176" text-anchor="start">uplift</text>
    <text x="472" y="136">sliding</text>
    <text x="598" y="112">liquefaction</text>
    <text x="735" y="198">overall stability</text>
  </g>

  <!-- Typologies -->
  <g text-anchor="middle">
    <g class="fill-doc-text" font-size="13" font-weight="600">
      <text x="140" y="312">Embankment dam</text>
      <text x="405" y="312">Concrete gravity dam</text>
      <text x="680" y="312">Tailings dam</text>
    </g>
    <g class="fill-doc-muted" font-size="11.5">
      <text x="140" y="328">with a clay core</text>
      <text x="405" y="328">on rock</text>
      <text x="680" y="328">raised in steps</text>
    </g>
  </g>
</svg>
