<svg xmlns="http://www.w3.org/2000/svg" class="h-auto w-full" viewBox="0 0 800 340" role="img" aria-label="Four retaining structures in one ground cross-section, with what to check on each. Gravity wall: sliding and toppling. Cantilever L-wall: bearing under its base. Braced excavation with embedded walls and struts: hydraulic heave of the base, wall deflection and ground movement under a neighboring building. Anchored sheet pile quay wall: embedment.">
  <defs>
    <pattern id="rs-sand" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="0.9" class="fill-gray-8"/><circle cx="9" cy="9" r="0.9" class="fill-gray-8"/></pattern>
    <pattern id="rs-clay" width="20" height="8" patternUnits="userSpaceOnUse"><path d="M0 2H8M10 6H18" class="stroke-gray-8" stroke-width="0.75"/></pattern>
    <marker id="rs-check" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fill-doc-accent"/></marker>
  </defs>

  <!-- Ground and water -->
  <path d="M622 140H800V205H622z" class="fill-gray-3"/>
  <path d="M0 110H80V150H218V110H365V200H455V110H619V205H800V238H0z" fill="url(#rs-sand)"/>
  <rect x="0" y="238" width="800" height="50" fill="url(#rs-clay)"/>
  <g class="fill-none stroke-doc-line">
    <path d="M0 238H800" class="stroke-gray-7" stroke-width="0.75"/>
    <path d="M0 140H58M222 140H362M458 140H616M368 206H452" stroke-width="1" stroke-dasharray="6 4"/>
    <path d="M622 140H800M774 133H786L780 140zM776 144H784M778 147H782" stroke-width="1.25"/>
    <path d="M0 110H62M100 150H214M222 110H362M368 200H452M458 110H616M622 205H800" stroke-width="1.5"/>
  </g>

  <!-- Structures -->
  <g class="stroke-doc-text" stroke-width="1.25">
    <path d="M62 104H84L100 162H56z" class="fill-gray-5"/>
    <rect x="214" y="104" width="8" height="48" class="fill-gray-5"/>
    <rect x="196" y="152" width="66" height="10" class="fill-gray-5"/>
    <g class="fill-gray-5"><rect x="362" y="104" width="6" height="166"/><rect x="452" y="104" width="6" height="166"/><rect x="368" y="122" width="84" height="4"/><rect x="368" y="158" width="84" height="4"/></g>
    <rect x="475" y="62" width="60" height="48" class="fill-doc-surface"/>
    <path d="M616 124L570 146" class="fill-none"/>
    <rect x="0" y="-3.5" width="28" height="7" transform="translate(545 158) rotate(-25.6)" class="fill-gray-5"/>
    <rect x="616" y="100" width="6" height="170" class="fill-gray-5"/>
  </g>

  <!-- Checks -->
  <g class="fill-none stroke-doc-accent" stroke-width="1.5">
    <path d="M60 170H98" marker-end="url(#rs-check)"/>
    <path d="M262 162Q232 200 172 150" stroke-dasharray="5 3"/>
    <g marker-end="url(#rs-check)"><path d="M390 236V212"/><path d="M410 236V212"/><path d="M430 236V212"/></g>
    <path d="M455 112Q438 175 455 250M458 114Q492 126 540 112" stroke-dasharray="5 3"/>
    <path d="M619 124L640 270" stroke-dasharray="5 3"/>
  </g>
  <g class="fill-doc-accent-text" font-size="11.5" text-anchor="middle">
    <text x="78" y="188">sliding, toppling</text>
    <text x="215" y="212">bearing</text>
    <text x="410" y="284">hydraulic heave</text>
    <text x="520" y="132">ground movement</text>
    <text x="690" y="262">embedment</text>
  </g>

  <!-- Typologies -->
  <g text-anchor="middle">
    <g class="fill-doc-text" font-size="13" font-weight="600">
      <text x="80" y="312">Gravity wall</text>
      <text x="230" y="312">Cantilever wall</text>
      <text x="410" y="312">Braced excavation</text>
      <text x="700" y="312">Quay wall</text>
    </g>
    <g class="fill-doc-muted" font-size="11.5">
      <text x="80" y="328">its weight holds</text>
      <text x="230" y="328">L-shaped</text>
      <text x="410" y="328">embedded walls, struts</text>
      <text x="700" y="328">anchored sheet pile</text>
    </g>
  </g>
</svg>
