name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      # mdx-marimo keeps compiled marimo pages here; reusing it skips running unchanged cells.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache
          key: marimo-${{ hashFiles('src/content/docs/**/*.mdx') }}
          restore-keys: marimo-
      - run: pnpm install --frozen-lockfile
      - run: just check
