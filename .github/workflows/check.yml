name: Check and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push to main replaces a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      # mdx-marimo keeps compiled marimo pages here; reusing it skips running unchanged cells.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache
          key: marimo-${{ hashFiles('src/content/docs/**/*.mdx') }}
          restore-keys: marimo-
      - run: pnpm install --frozen-lockfile
      # Copied files and generated pages are current, the site builds, every link resolves.
      - run: just check
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
